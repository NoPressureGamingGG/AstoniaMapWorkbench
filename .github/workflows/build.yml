name: Build Workbench

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Build Release
        run: dotnet build AstoniaMapWorkbench.csproj --configuration Release --no-restore
      - name: Publish self-contained Windows build
        run: dotnet publish AstoniaMapWorkbench.csproj --configuration Release --runtime win-x64 --self-contained true --output publish/win-x64
      - name: Upload standalone Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: AstoniaMapWorkbench-win-x64
          path: publish/win-x64/