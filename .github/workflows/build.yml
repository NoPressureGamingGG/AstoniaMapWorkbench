name: Build Workbench

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Build Release
        run: dotnet build AstoniaMapWorkbench.csproj --configuration Release --no-restore